name: CI — Stock Management

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'        # ← CHANGED from 8.0.x (.slnx requires 9.0.200+)
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SOLUTION: 'EchoStockManagement.slnx'

jobs:
  # ============================================================
  # JOB 1 — Build + Unit + Component tests
  # ============================================================
  build-and-unit:
    name: Build + Unit + Component Tests
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Print SDK info
        run: dotnet --info

      - name: Inspect repository layout
        shell: pwsh
        run: |
          Write-Host "=== Repo root ==="
          Get-ChildItem -Force | Format-Table Name, Mode
          Write-Host "=== Solution files ==="
          Get-ChildItem -Recurse -Include *.sln,*.slnx |
              Select-Object FullName

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Unit + Component tests
        run: >
          dotnet test StockManagement.Tests/StockManagement.Tests.csproj
          -c Release --no-build
          --filter "Category=Unit|Category=Component"
          --logger "trx;LogFileName=fast-tests.trx"
          --logger "console;verbosity=minimal"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload test + coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fast-test-results
          path: TestResults/
          retention-days: 14

  # ============================================================
  # JOB 2 — Integration tests
  # ============================================================
  integration:
    name: Integration Tests (LocalDB)
    runs-on: windows-latest
    needs: build-and-unit
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb create MSSQLLocalDB -s
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Integration tests
        run: >
          dotnet test StockManagement.Tests/StockManagement.Tests.csproj
          -c Release --no-build
          --filter "Category=Integration"
          --logger "trx;LogFileName=integration-tests.trx"
          --logger "console;verbosity=minimal"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: TestResults/
          retention-days: 14

  # ============================================================
  # JOB 3 — Coverage gate
  # ============================================================
  coverage:
    name: Coverage Gate
    runs-on: windows-latest
    needs: [ build-and-unit, integration ]
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download all coverage artifacts
        uses: actions/download-artifact@v4
        with:
          path: coverage-input

      - name: Inspect downloaded artifacts
        shell: pwsh
        run: |
          Write-Host "=== coverage-input tree ==="
          if (Test-Path coverage-input) {
              Get-ChildItem -Recurse coverage-input |
                  Select-Object FullName, Length |
                  Format-Table -AutoSize
          } else {
              Write-Host "coverage-input not found!"
              exit 1
          }

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Merge coverage reports
        shell: pwsh
        run: |
          $coverageFiles = Get-ChildItem -Recurse -Filter "coverage.cobertura.xml" -Path coverage-input |
                           Select-Object -ExpandProperty FullName

          if ($coverageFiles.Count -eq 0) {
              Write-Error "No coverage.cobertura.xml found. Did the test jobs run coverlet.collector?"
              exit 1
          }

          Write-Host "Found $($coverageFiles.Count) coverage file(s):"
          $coverageFiles | ForEach-Object { Write-Host "  $_" }

          $reportsArg = ($coverageFiles -join ";")
          reportgenerator "-reports:$reportsArg" "-targetdir:coverage-report" "-reporttypes:Cobertura;HtmlInline;TextSummary"

      - name: Enforce coverage threshold
        shell: pwsh
        run: |
          $xml = [xml](Get-Content "coverage-report/Cobertura.xml")
          $lineRate = [double]$xml.coverage.'line-rate' * 100
          Write-Host ("Line coverage: {0:N2}%" -f $lineRate)

          if ($lineRate -lt 70) {
            Write-Error ("Line coverage {0:N2}% is below 70%." -f $lineRate)
            exit 1
          }

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report/
          retention-days: 30

  # ============================================================
  # JOB 4 — Publish test report
  # ============================================================
  report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: [ build-and-unit, integration ]
    if: always() && github.event_name == 'pull_request'

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Download all TRX files
        uses: actions/download-artifact@v4
        with:
          path: test-results

      - name: Publish test report
        uses: dorny/test-reporter@v1
        with:
          name: Test Results
          path: 'test-results/**/*.trx'
          reporter: dotnet-trx
          fail-on-error: true

  # ============================================================
  # JOB 5 — Final gate
  # ============================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [ build-and-unit, integration, coverage ]
    if: always()

    steps:
      - name: Verify all required jobs passed
        shell: bash
        run: |
          if [ "${{ needs.build-and-unit.result }}" != "success" ]; then
            echo "build-and-unit failed"; exit 1
          fi
          if [ "${{ needs.integration.result }}" != "success" ]; then
            echo "integration failed"; exit 1
          fi
          if [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "coverage gate failed"; exit 1
          fi
          echo "All CI checks passed."